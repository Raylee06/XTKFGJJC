[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greetlab-24030021037"
version = "0.1.0"

[project.scripts]
sdt-greet = "greetlab.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "ruff>=0.5.0"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
